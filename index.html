				attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
			}).addTo(map);

			function zoomToFeature(e) {
    			map.fitBounds(e.target.getBounds());
			};

			const precincts_longsew = L.geoJson(precincts, {
				style: style_precincts_longsew,
				onEachFeature: onEachFeature_precincts
			}).addTo(map);
			
			const public_property_mpls_minus_ROW = L.geoJson(public_property_mpls, {

			}).addTo(map);

			const public_property_minus_ROW = L.geoJson(public_property, {
				style: style_public_property_minus_ROW
			}).addTo(map);

			const buffer100ft = L.geoJson(buffer, {
				style: style_buffer100ft
			}).addTo(map);

			const buildings = L.geoJson(footprints, {
				style: style_buildings
			}).addTo(map);

			// Labels for layers
			function onEachFeature_precincts(feature, layer) {
				if (feature.properties && feature.properties.name) {
					layer.bindTooltip(feature.properties.name, {
						permanent: true,
						direction: "center",
						className: "polygon-label",
						opacity: 0.6
					});
				}
			};

			function style_precincts_longsew(feature) {
				return {

					weight: 2,
					fillOpacity: 0,

			}

			function style_buildings(feature) {
				return {
					color: 'blue',
					weight: 3,
					fillOpacity: 1,

			}
			
			function style_buffer100ft(feature) {
				return {
					color: 'red',
					weight: 3,
					fillOpacity: 0,
				}
			}
			
			function style_public_property_minus_ROW(feature) {
				return {
					color: 'red',
					weight: 3,
					fillOpacity: 0.5,
				}
			}

			function style_public_property_mpls_minus_ROW(feature) {
				return {
					color: 'orange',
					weight: 3,
					fillOpacity: 0.5,
				}
			}

			// Adds functionality relating to fetching device location (adds a circle at the location) 
			function onLocationFound(e) {
				L.circle(e.latlng, {
					color: 'purple',
					fillColor: 'purple',
					fillOpacity: 0.5,
					radius: 5
				}).addTo(map);
			}
			map.on('locationfound', onLocationFound);

			function onLocationError(e) {
				alert(e.message);
			}
			map.on('locationerror', onLocationError);
